name: Build templates
on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build_templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: ["ams", "siam", "springer", "acm", "llncs"]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up ${{ matrix.template }} template
        run: |
          cd $GITHUB_WORKSPACE
          $GITHUB_WORKSPACE/latex-styles-scratch/bin/new_paper ${{ matrix.template}}paper mypaper
      - name: Compile ${{ matrix.template }} template
        uses: xu-cheng/latex-action@v3
        with:
          texlive_version: latest
          root_file: |
            $GITHUB_WORKSPACE/mypaper/paper/mypaper.tex
          working_directory: $GITHUB_WORKSPACE/mypaper/paper
          extra_system_packages: "git patch"
          latexmk_shell_escape: true
          pre_compile: git config --global --add safe.directory /github/workspace
        env:
          TEXINPUTS: ".:$GITHUB_WORKSPACE/latex-styles-scratch/styles//:"
          BSTINPUTS: ".:$GITHUB_WORKSPACE/latex-styles-scratch/styles/common"
          BIBINPUTS: ".:$GITHUB_WORKSPACE/latex-styles-scratch/share"
